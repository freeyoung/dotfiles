# The switches of the Ghostty build in a local checkout. They are off until
# they are asked for, so that one configuration file serves that build and the
# Ghostty it was built from, which would warn about a setting it does not know.
#
# On the Mac the asking is a default of the application, which `install` writes.
# There is no such place on this desktop, so it is an environment variable, and
# a variable has to reach the session rather than ~/.config/ghostty: systemd's
# user manager reads this directory at login and hands what it finds to
# everything it starts, which under Omarchy is everything, uwsm running each
# application as a unit of that manager.
#
# Read at login. To turn it on in a session that is already running:
#
#   systemctl --user set-environment GHOSTTY_SPLIT_AUTO_EQUALIZE=1
#
# Splits stay equal when 1 opens and when 1 closes, as they do on the Mac. The
# other half of that build, the tab of a session saying what it is doing, needs
# no switch: see omarchy/ghostty/linux.conf.
GHOSTTY_SPLIT_AUTO_EQUALIZE=1
