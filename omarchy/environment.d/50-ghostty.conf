# The switches of the Ghostty build in ~/code/ai/ghostty. They are off until
# they are asked for, so that one configuration file serves that build and the
# Ghostty it was built from, which would warn about a setting it does not know.
#
# On the Mac the asking is a default of the application, which `install` writes.
# There is no such place on this desktop, so it is an environment variable, and
# a variable has to reach the session rather than ~/.config/ghostty: systemd's
# user manager reads this directory at login and hands what it finds to
# everything it starts, which under Omarchy is everything, uwsm running each
# application as a unit of that manager.
#
# Read at login. To turn it on in a session that is already running:
#
#   systemctl --user set-environment GHOSTTY_SPLIT_AUTO_EQUALIZE=1
#
# Splits stay equal when 1 opens and when 1 closes, as they do on the Mac.
GHOSTTY_SPLIT_AUTO_EQUALIZE=1

# How long the progress bar over a pane stands without an update before it is
# taken for a program that has stalled. Ghostty's own answer is 15 seconds,
# which is shorter than a Claude Code session thinks for, so the bar goes out in
# the middle of work that is still running. 120 is what the Mac is set to.
GHOSTTY_PROGRESS_REPORT_TIMEOUT=120

# A program that turns mouse reporting on, such as an editor or Claude Code,
# owns the pointer, and Ghostty stops underlining links under it -- which in
# Claude Code is most of the links there are. This gives control-hover its
# link back: hold control and the link underlines and opens, let go and it is
# the program's again. The program keeps every mouse event it asked for; the
# only thing withheld is the click that lands on the link.
GHOSTTY_LINK_HOVER_MOUSE_CAPTURE=1

# The rest of what that build adds -- the dot and the spinner on the tab of a
# session -- needs no switch: see omarchy/ghostty/linux.conf.
