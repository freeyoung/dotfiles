# What a Claude Code session is doing, drawn into kitty's tab bar and into each
# window's title. Read through the globinclude in kitty.conf and linked into
# ~/.config/kitty by `install` on an Omarchy host only, so a host without one
# never sees these two settings and keeps kitty's own tab bar.
#
# Both files are looked for in kitty's configuration directory, wherever they
# are linked from: tab_bar.py is the drawing function tab_bar_style names, and
# claude_title.py is a watcher kitty loads into every window it opens
# afterwards. They share claude_status.py, which is linked beside them.

tab_bar_style               custom
watcher                     claude_title.py
