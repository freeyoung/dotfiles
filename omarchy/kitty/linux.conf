# kitty on this Linux desktop: what the shared kitty.conf cannot say. It pulls
# this in by name if `install` has linked it, which it does only where a
# Hyprland binary is, the same guard the rest of omarchy/ has. On a Mac the
# glob matches nothing and nothing here applies.

# Font size, and the one reason this file exists. The shared file says 11,
# which is what the Mac wants. This desktop wants 13, and not because the
# screen is different: GNOME's text-scaling-factor multiplies every point size
# a GTK application draws, Ghostty honours it and kitty does not, so while the
# factor was 1.1818 the 2 terminals both said 11 and drew cells 20 and 17
# pixels wide. The factor is 1 here now and both terminals say the size
# outright -- 13, which is what 11 times that factor came to, so the screen
# looks as it did and kitty is the one that moved.
#
# Keep this the same number as omarchy/ghostty/linux.conf, which carries the
# longer note. The cut of the cell is in the shared file and applies to both.
font_size 13.0
