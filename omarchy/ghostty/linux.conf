# Ghostty on a Linux desktop: what the shared config next door cannot say. The
# shared file pulls this in by name if `install` has linked it, which it does
# only where a Hyprland binary is, the same guard the rest of omarchy/ has.
#
# Omarchy themes every terminal it knows about, and the theme it is on is a
# link at ~/.config/omarchy/current/theme. The path below is relative to
# ~/.config/ghostty/, where this file is linked, and the ? in front of it means
# a host without Omarchy, or an Omarchy theme with nothing for Ghostty, is not
# an error. It comes after the shared `theme`, so it wins where it says
# anything.
config-file = ?../omarchy/current/theme/ghostty.conf

# Nothing else yet. The window itself is Hyprland's to place, and the keys are
# the shared ones: this desktop has no cmd, so the macOS-only keys next door
# are not missed.
