# Ghostty on a Linux desktop: what the shared config next door cannot say. The
# shared file pulls this in by name if `install` has linked it, which it does
# only where a Hyprland binary is, the same guard the rest of omarchy/ has.
#
# Omarchy themes every terminal it knows about, and writes the Ghostty colors of
# the theme it is on to the path below. This is the line Omarchy's own config
# carries, spelled the way Omarchy spells it: under ~/.local/state, which is
# where Omarchy 4 keeps the current theme, and where kitty.conf next door looks
# for its own. The ? in front means a host without Omarchy, or an Omarchy theme
# with nothing for Ghostty, is not an error -- and so is a path that has moved,
# so it is worth watching the colors follow the next theme change. It comes
# after the shared `theme`, so it wins where it says anything.
config-file = ?"~/.local/state/omarchy/current/theme/ghostty.conf"

# The font. The block in the shared config is the Mac's, written against the
# iTerm2 profile: font-size 14, and the cell cut to that profile's 94% and 96%,
# which is what the kitty over there is set to as well. The kitty on this
# desktop says 11 and leaves the cell alone, and a terminal that does not match
# the one beside it is the thing you notice first, so this says what that kitty
# says. Drop these 3 lines to have Ghostty keep the Mac's proportions here.
font-size = 11
adjust-cell-width = 0%
adjust-cell-height = 0%

# The family, too, because the shared one is not installed here. Omarchy depends
# on ttf-jetbrains-mono-nerd-basic, which carries only the base family; the Mono
# variant the shared config names lives in the full ttf-jetbrains-mono-nerd,
# which conflicts with the basic one and so cannot be installed without taking
# the omarchy package's dependency with it. Ghostty falls back to this face
# without a word -- the same face the kitty here uses -- so naming it changes
# nothing on screen and stops the file from claiming a font that is not there.
# `font-family` appends rather than replaces, so the empty value clears what the
# shared file put in the list before this names the one to use.
font-family =
font-family = JetBrainsMono Nerd Font

# Nothing else. The window itself is Hyprland's to place, and the keys are the
# shared ones: this desktop has no cmd, so the macOS-only keys next door are not
# missed.
#
# What the Ghostty build in a local checkout adds is off until it is asked for,
# as on the Mac, where the answers live in the defaults of the application.
# There is no such place here, so the 1 switch that exists is an environment
# variable, which has to reach the session rather than this file:
#
#   GHOSTTY_SPLIT_AUTO_EQUALIZE=1   splits stay equal when 1 opens or closes
#
# It is set in omarchy/environment.d/50-ghostty.conf, which `install` links next
# to this file, into the directory systemd's user manager reads at login.
#
# The tab of a session says what it is doing without being asked: a working tab
# spins, as a loading page does, and a waiting tab carries a dot, as a tab that
# rang the bell does. Both are libadwaita's own, not a ring drawn over them --
# the rings on this desktop are quickshell's, over Hyprland's tabs.
