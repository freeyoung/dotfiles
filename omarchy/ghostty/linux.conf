# Ghostty on a Linux desktop: what the shared config next door cannot say. The
# shared file pulls this in by name if `install` has linked it, which it does
# only where a Hyprland binary is, the same guard the rest of omarchy/ has.
#
# Omarchy themes every terminal it knows about, and writes the Ghostty colors of
# the theme it is on to the path below. This is the line Omarchy's own config
# carries, spelled the way Omarchy spells it: under ~/.local/state, which is
# where Omarchy 4 keeps the current theme, and where kitty.conf next door looks
# for its own. The ? in front means a host without Omarchy, or an Omarchy theme
# with nothing for Ghostty, is not an error -- and so is a path that has moved,
# so it is worth watching the colors follow the next theme change. It comes
# after the shared `theme`, so it wins where it says anything.
config-file = ?"~/.local/state/omarchy/current/theme/ghostty.conf"

# The font. The block in the shared config is the Mac's, written against the
# iTerm2 profile: font-size 14, and the cell cut to that profile's 94% and 96%,
# which is what the kitty over there is set to as well. The kitty on this
# desktop says 11 and leaves the cell alone, and a terminal that does not match
# the one beside it is the thing you notice first, so this says what that kitty
# says. Drop these 3 lines to have Ghostty keep the Mac's proportions here.
font-size = 11
adjust-cell-width = 0%
adjust-cell-height = 0%

# The family, too, because the shared one is not installed here. Omarchy depends
# on ttf-jetbrains-mono-nerd-basic, which carries only the base family; the Mono
# variant the shared config names lives in the full ttf-jetbrains-mono-nerd,
# which conflicts with the basic one and so cannot be installed without taking
# the omarchy package's dependency with it. Ghostty falls back to this face
# without a word -- the same face the kitty here uses -- so naming it changes
# nothing on screen and stops the file from claiming a font that is not there.
# `font-family` appends rather than replaces, so the empty value clears what the
# shared file put in the list before this names the one to use.
font-family =
font-family = JetBrainsMono Nerd Font

# The splits, in the shape they have on the Mac. Ghostty's default there is
# cmd+d and cmd+shift+d -- 1 letter, with shift picking the other direction --
# which is iTerm2's shape and the one the hands know. On Linux it ships
# ctrl+shift+o and ctrl+shift+e instead: 2 letters that say nothing and do not
# pair. There is no cmd on this desktop, and ctrl+shift has no shift of its own
# left to give, so the letter has to move to another modifier.
#
# alt is the one that reaches it with the fewest fingers, and it is not free.
# `bindkey` in the zsh here has both ^[d and ^[D on kill-word, the emacs keymap
# being the main one, so this takes alt+d and alt+shift+d away from the prompt
# -- and, alt being Meta, from everything else drawn inside a terminal that
# wants a Meta chord of its own. That is the trade, made knowingly: the hands
# reach for this shape, and kill-word is reachable other ways. ctrl+alt+d and
# ctrl+alt+shift+d keep the same shape at no cost to the shell, and are what to
# go back to if the prompt is missed. Nothing else collides: no alt letter is
# bound in Ghostty, and every ALT binding in Hyprland is TAB or a media key.
#
# SUPER is not a candidate, but it is worth knowing that the SUPER+D pair in
# hypr/bindings.lua is already this shape at the window-manager layer, opening a
# terminal in a Hyprland split rather than a pane in this one -- on a keyboard
# without cmd, SUPER is the key sitting where cmd sits.
#
# The defaults are left alone, because adding a binding does not take one away
# and ctrl+shift+o is what Ghostty's own command palette shows. Add
# `keybind = ctrl+shift+o=unbind` to be left with 1 way to do it.
keybind = alt+d=new_split:right
keybind = alt+shift+d=new_split:down

# Nothing else. The window itself is Hyprland's to place, and the rest of the
# keys are Ghostty's own defaults: this desktop has no cmd, so the macOS-only
# keys next door are not missed.
#
# What the Ghostty build in a local checkout adds is off until it is asked for,
# as on the Mac, where the answers live in the defaults of the application.
# There is no such place here, so the switches are environment variables, which
# have to reach the session rather than this file:
#
#   GHOSTTY_SPLIT_AUTO_EQUALIZE=1     splits stay equal when 1 opens or closes
#   GHOSTTY_PROGRESS_REPORT_TIMEOUT=  seconds a progress bar stands without an
#                                     update before it is taken down, 0 for
#                                     never. Ghostty's own answer is 15, which
#                                     is shorter than a session thinks for.
#
# Both are set in omarchy/environment.d/50-ghostty.conf, which `install` links
# next to this file, into the directory systemd's user manager reads at login.
#
# The tab of a session says what it is doing without being asked: a colored dot
# for the state, the same 3 colors as the kitty tab bar next door, blinking
# while the session waits; and, while it works, the spinner of a loading page,
# which is what the ring on the Mac becomes here. The dot is drawn rather than
# asked of libadwaita, whose own mark cannot say which of 3 things happened.
# Neither is a ring laid over the tab -- the rings on this desktop are
# quickshell's, over Hyprland's tabs.
