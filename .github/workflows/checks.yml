name: checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Every check in the bootstrap is guarded on the tool existing, so a tool
      # that is absent is a check that silently does not run. Install them.
      - name: Install the tools the checks look for
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh vim tmux lua5.4

      - name: Install the tools the checks look for
        if: runner.os == 'macOS'
        run: brew install tmux lua

      # The Lua check calls luac by that name; the packages may only provide a
      # versioned one.
      - name: Make luac available under its plain name
        run: |
          command -v luac >/dev/null ||
            sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac
          luac -v

      - name: Clean offline bootstrap
        run: bash scripts/check-bootstrap.sh

      - name: Syntax-check what the bootstrap does not run
        run: |
          bash -n install
          for script in scripts/*.sh; do bash -n "$script"; done

      # Off Omarchy this reports that and exits 0. That is all CI can see of
      # it, but it does prove the script parses and runs on both platforms.
      - name: Omarchy review runs where Omarchy is absent
        run: bash scripts/omarchy-review.sh
