# Keys that work like iTerm2 (2026-09-15).

# Keys shared with tmux: when the pane runs tmux, the key acts on tmux (tmux_or_kitty.py), otherwise on kitty.
# Shared: cmd+1..9, cmd+t, cmd+d, cmd+shift+d, cmd+shift+enter, cmd+[ ], cmd+alt+arrows, cmd+left/right.
action_alias tmux_or kitten tmux_or_kitty.py

# Split panes: cmd+d side by side, cmd+shift+d top and bottom. Rebalance all panes after a split
# and after a pane closes. New panes open in the home directory, like the iTerm2 profile.
enabled_layouts splits:equalize_on_window_close=true,stack
# Splitting leaves a maximized pane first (goto_layout splits), like iTerm2.
map cmd+d       tmux_or vsplit combine : goto_layout splits : launch --location=vsplit --cwd=~ : layout_action equalize
map cmd+shift+d tmux_or hsplit combine : goto_layout splits : launch --location=hsplit --cwd=~ : layout_action equalize
# iTerm2 View > Maximize Active Pane (cmd+shift+enter): show only the current pane, press again to restore.
map cmd+shift+enter tmux_or zoom toggle_layout stack
# New tabs and windows also open in the home directory. Without --cwd they use kitty's own directory, which is / when kitty starts from the Dock.
map cmd+t tmux_or new_window launch --type=tab --cwd=~
map cmd+n launch --type=os-window --cwd=~
# iTerm2 closes the current pane with cmd+w (kitty default closes the whole tab).
map cmd+w close_window

# cmd+1..9 go to a tab (kitty default goes to a pane).
map cmd+1 tmux_or window:1 goto_tab 1
map cmd+2 tmux_or window:2 goto_tab 2
map cmd+3 tmux_or window:3 goto_tab 3
map cmd+4 tmux_or window:4 goto_tab 4
map cmd+5 tmux_or window:5 goto_tab 5
map cmd+6 tmux_or window:6 goto_tab 6
map cmd+7 tmux_or window:7 goto_tab 7
map cmd+8 tmux_or window:8 goto_tab 8
map cmd+9 tmux_or window:9 goto_tab 9

# Panes: cmd+] / cmd+[ cycle, cmd+alt+arrow moves by direction.
map cmd+]         tmux_or next_pane next_window
map cmd+[         tmux_or prev_pane previous_window
map cmd+alt+left  tmux_or pane:left neighboring_window left
map cmd+alt+right tmux_or pane:right neighboring_window right
map cmd+alt+up    tmux_or pane:up neighboring_window up
map cmd+alt+down  tmux_or pane:down neighboring_window down

# From the iTerm2 global key map: cmd+arrow changes tab, cmd+shift+arrow moves the tab.
map cmd+left        tmux_or prev_window previous_tab
map cmd+right       tmux_or next_window next_tab
map cmd+shift+left  move_tab_backward
map cmd+shift+right move_tab_forward

# From the iTerm2 profile key map: option+arrow jumps by word.
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf
map alt+up    send_text all \x1b\x1b[A
map alt+down  send_text all \x1b\x1b[B

# iTerm2 View > Use Transparency (cmd+u): turn background transparency off and on.
map cmd+u kitten toggle_transparency.py

# cmd+f: live incremental search, like the iTerm2 find bar. Type to search, up/down to move between matches,
# Tab for regex, Enter to stay at the match, Esc to go back to the bottom.
# Kitten: https://github.com/trygveaa/kitty-kitten-search (cloned into kitty_search/, update with git pull).
# The pager-based search stays on ctrl+shift+/.
map cmd+f launch --location=hsplit --bias=8 --allow-remote-control kitty +kitten kitty_search/search.py @active-kitty-window-id

# Smart selection, like iTerm2 (ctrl+shift+p then o), is in the shared kitty.conf.

# Copy the selection to the clipboard as soon as you select, like iTerm2 (on by default there).
copy_on_select clipboard

# Links open with cmd+click, like iTerm2. A plain click only selects text or moves the cursor at the prompt.
# This covers plain-text URLs (found by url_prefixes) and OSC 8 hyperlinks.
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection prompt
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event
# Show the target of an OSC 8 hyperlink while cmd is held.
show_hyperlink_targets cmd
