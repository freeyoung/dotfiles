# iTerm2-like look for kitty (2026-09-15). Included by macos.conf.
# Colors come from an iTerm2 3.7 screenshot in dark mode.

# Title bar and tab bar margins use the iTerm2 window chrome color.
macos_titlebar_color #262626
# Show the title of the active pane only in the window title bar, not in the macOS menu bar.
macos_show_window_title_in window

# The band of light under the tab of a working Claude Code session (tab_bar.py) is an underline.
# A thicker underline is easier to see, and no gaps under g, j, p, q and y keep it 1 unbroken line.
# These settings also apply to underlined text in the panes. iTerm2 does not put gaps in underlines either.
underline_exclusion 0
modify_font underline_thickness 200%

# Tab bar: tab_bar.py draws the rounded track, the dividers and the selected pill.
tab_bar_edge top
tab_bar_style custom
tab_bar_margin_width 8.0
# Margins above and below the tab row. They share tab_bar_margin_color with the title bar color (#262626),
# so the top margin does not show as a separate gap.
tab_bar_margin_height 7.0 2.0
tab_bar_background #262626
tab_bar_margin_color #262626
active_tab_font_style normal
inactive_tab_font_style normal

# A title bar on each pane when a tab has 2 or more panes, like iTerm2 split panes.
window_title_bar top
window_title_bar_min_windows 2
window_title_bar_align left
# {custom} comes from window_title_bar.py: the pane title without the glyph Claude Code puts before it,
# then the Claude Code status and detail text of the pane.
window_title_template "{custom}"
window_title_bar_active_background #565757
window_title_bar_active_foreground #f2f2f2
window_title_bar_inactive_background #3c3c3c
window_title_bar_inactive_foreground #9a9a9a

# When the window height is not a whole number of text rows, put the spare space at the bottom instead of
# splitting it above and below (a strip of up to about 8pt under the title bar). Left and right stay centered,
# so panes keep a thin black gap on both sides of a divider.
placement_strategy top
# Instead, a fixed 3pt black strip above every pane, to match those gaps. This is padding, not
# window_margin_width: any window margin makes kitty stop drawing the 1pt divider between panes.
window_padding_width 3 0 0 0

# Thin gray dividers between panes.
draw_minimal_borders yes
window_border_width 1px
active_border_color #5d5d5d
inactive_border_color #5d5d5d

# Dim inactive panes by background color (iterm2_watcher.py), not by text alpha.
watcher iterm2_watcher.py
