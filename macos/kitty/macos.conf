# The macOS layer: kitty set up to look and work like iTerm2. kitty/kitty.conf
# pulls this in by glob as its last line, and `install` links it into
# ~/.config/kitty on macOS only, so the glob matches nothing on any other host.
# Coming last, every setting here wins over the shared one above it.
#
# Relative includes resolve against the directory the config is read from, which
# is ~/.config/kitty, where `install` links the files named below.

# Colors, chosen per host and kept out of the repository. `kitten themes` edits
# the file it is told to, so run it as
#     kitten themes --config-file-name macos-theme.conf
# Run without that option it would write an include into the shared kitty.conf,
# and a host that lacks the file it names shows an error in every window.
# A glob, so a host that has never picked a theme keeps kitty's own colors.
# First, so the files after it can override the tab bar, borders and cursor.
globinclude macos-theme.conf

# Font, cursor, transparency, window size and remote control, from the iTerm2 profile.
include iterm2-profile.conf

# Tab bar, pane title bars and dividers that look like iTerm2.
include iterm2-look.conf

# Split panes, tabs and keys that work like iTerm2.
include iterm2-keys.conf
