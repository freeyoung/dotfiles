# Settings copied from the iTerm2 "Default" profile (2026-09-15). Included by macos.conf.

# Font: 14pt, the size iTerm2 was set to. The family and the cut of the cell
# are in the shared file: the cell size this profile wants, measured on screen
# at 8.0pt wide and 18pt high, is a ratio that means the same on either machine.
# (iTerm2 spacing 0.9 scales a different base size, so 90% there is too tight.)
#
# The styles are pinned because the family alone leaves kitty to choose them.
# They name the plain Nerd Font variant, as the shared file does: this profile
# used to name the Mono one, which quietly cost it the shared `font_features`
# line -- that names a PostScript face, JetBrainsMonoNF-Regular, and the Mono
# variant is JetBrainsMonoNFM-Regular, so it matched nothing here and the
# ligatures were off by disable_ligatures alone. Measured, the 2 variants are
# the same font but for 24 combining marks.
bold_font        family="JetBrainsMono Nerd Font" style=Bold
italic_font      auto
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"
font_size 14.0
disable_ligatures always

# Cursor: block, no blinking. Hollow when the window is not focused. The cursor color comes from the theme.
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
# Keep the block cursor at the shell prompt. By default kitty shell integration changes it to a beam.
shell_integration enabled no-cursor

# Background: iTerm2 transparency 20%, no blur, but an opaque title bar.
# kitty gives the macOS title bar the same opacity as background_opacity, so keep that almost opaque (0.999:
# still a transparent window) and make only the terminal background colors 80% opaque.
# The list has the background and the dimmed inactive-pane background of each theme in use:
#   My iTerm2: #000000, #333333    Tokyo Night: #1a1b26, #484951
# Add both colors here when you use another theme. cmd+u turns the transparency off and on (toggle_transparency.py).
background_opacity 0.999
transparent_background_colors #000000@0.8 #333333@0.8 #1a1b26@0.8 #484951@0.8
# Required: without it kitty does not create a transparent window when background_opacity is this close to 1.
dynamic_background_opacity yes

# The shared kitty/kitty.conf hides the title bar and silences the bell for Omarchy. On macOS keep the title
# bar with its window buttons, and the bell, which the iTerm2 profile does not silence either.
hide_window_decorations no
enable_audio_bell yes

# Quit kitty when the last window closes (iTerm2 "Quit when all windows are closed").
macos_quit_when_last_window_closed yes

# Unlimited scrollback, and no confirmation when closing, like the iTerm2 profile.
scrollback_lines -1
confirm_os_window_close 0

# The Claude Code status hook (cc-status) talks to kitty over this socket.
# socket-only: programs inside the terminal cannot use escape codes to control kitty.
allow_remote_control socket-only
listen_on unix:${TMPDIR}/kitty

# Window size: the left half of the screen, 960x1050 pt including the 28 pt title bar.
# Sizes are in points on macOS. Use a "c" suffix for cells, for example 118c and 50c.
remember_window_size no
initial_window_width  960
initial_window_height 1022
# Position: set by macos-launch-services-cmdline (--position 0x0), used when kitty starts from the Dock or Finder.
