# Quick access terminal (kitten quick-access-terminal), like the iTerm2 hotkey window in the Default profile:
# a floating 118x50 window with the same 20% transparency, hidden when it loses focus.
# Global shortcut: System Settings > Keyboard > Keyboard Shortcuts > Services > General > Quick access to kitty.
edge center-sized
columns 118
lines 50
layer overlay
hide_on_focus_loss yes
background_opacity 0.8
