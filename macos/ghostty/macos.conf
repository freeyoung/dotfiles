# Ghostty on macOS: what the shared config next door cannot say, because it
# would mean nothing on another desktop. The shared file pulls this in by name
# if `install` has linked it, which it does only on a Mac.

# The title bar stays opaque, as in the kitty configuration, and the macOS tab
# bar sits under it. The "tabs" style, which would put the tabs in the title
# bar, draws only the active tab in Ghostty 1.3.1: the others are invisible,
# whatever the window width. "transparent" works but lets the window behind
# show through the title bar.
macos-titlebar-style = native

# Blend the text into the background in linear space rather than in the color
# space macOS blends in. Measured against the kitty beside it, on the same face
# at the same size: the letters are the same width and the same height to the
# pixel, and Ghostty lays down a quarter less ink, which reads as text that is
# larger and looser rather than lighter. This makes up half of that without
# touching a glyph -- light text on a dark background gains weight in linear
# space. `font-thicken` was the other way to do it and it fattens the shapes
# themselves, which looks like what it is.
#
# Linux already blends this way: Ghostty's default there is linear-corrected.
alpha-blending = linear

# Font. The Mac's half of what the shared file used to say for both. The Mono
# variant keeps every glyph 1 cell wide, and the cell is cut to the proportions
# of the iTerm2 profile beside it: kitty says 94% and 96%, which is -6% and -4%
# here.
font-family = JetBrainsMono Nerd Font Mono
font-size = 14
adjust-cell-width = -6%
adjust-cell-height = -4%

# Chinese, named rather than left to CoreText. JetBrains Mono has no CJK, so a
# Han codepoint falls through to whatever the system picks, and CoreText picks
# by the languages of the process -- this Mac lists en-US and de-DE and no
# Chinese, so Han can land on a Korean face. Worse, the choice is made once,
# when the font grid for a size is first built, and that grid is then cached
# for the life of the process (src/font/SharedGridSet.zig ref()): a window
# opened later at the same size reuses it, and only a change of size builds a
# new one, which is why cmd+= then cmd+- put it right and nothing else did.
#
# Naming a font here is what holds it still. Which one is named matters much
# less: PingFang is what macOS was reaching for by itself on the occasions it
# reached right, and it needs nothing installed.
#
# Repeating font-family appends a fallback rather than replacing it, and the
# bold and italic styles need no line of their own: Ghostty looks for the
# stylistic variants of every family in the list.
#
# PingFang's Han advance is 1 em against the 1.2 em that 2 JetBrains Mono cells
# come to, so a Han glyph is scaled to fill 5/6 of its box. Maple Mono NF CN is
# the one face measured here that needs no scaling, being drawn from JetBrains
# Mono itself, if that ever starts to show.
#
# The Linux side settles this in fontconfig instead -- Noto Sans CJK SC, with
# rules that keep Han on Chinese forms -- so this belongs here and not in the
# shared file.
font-family = PingFang SC

# Come back with the windows, tabs and splits that were open, and with each of
# them in the directory it was in, which the shell integration reports. macOS
# does this only for an application that was forced to quit, or for every
# application if Settings says so; this asks for it whatever Settings says.
#
# What comes back is the arrangement, not what was running in it: every shell
# starts again, and a Claude Code session that was in one is gone.
window-save-state = always

# Half the screen, which is how the windows on this Mac are arranged. The size
# is in cells, so this is the count that comes to 960 points of the 1920 this
# screen has, at font-size 14. window-padding-balance takes up what is left over.
window-width = 118
window-height = 62

# Keys that Ghostty has no default for. The rest of the iTerm2 keys are
# Ghostty defaults already: cmd+d, cmd+shift+d, cmd+w, cmd+t, cmd+[, cmd+],
# cmd+alt+arrows, cmd+shift+enter, cmd+f and cmd+1 to cmd+9.
keybind = cmd+u=toggle_background_opacity
keybind = cmd+left=previous_tab
keybind = cmd+right=next_tab
keybind = cmd+shift+left=move_tab:-1
keybind = cmd+shift+right=move_tab:1

