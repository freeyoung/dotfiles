<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Installed to /etc/fonts/conf.d/31-cjk-lastresort.conf, and that path is
       the point of the file rather than an accident of it.

       These are scan rules. A scan rule is applied when a font is read into
       the cache, not when it is matched, so what it says lives in the cache
       and not in the configuration any application reads at startup. Which
       cache, then, decides everything. fonts.conf lists two, in this order:

           <cachedir>/var/cache/fontconfig</cachedir>
           <cachedir prefix="xdg">fontconfig</cachedir>

       The system one is first, and when both are valid the system one is what
       applications read. pacman rebuilds exactly that on any font package,
       from a hook whose action is `fc-cache -s`, run as root, which reads
       /etc/fonts and never sees ~/.config/fontconfig. So these rules, kept in
       the user's fonts.conf where they began, were written into the user
       cache, and every font package pacman installed quietly replaced that
       with a system cache that had never heard of them. The rules did not
       break; they stopped existing, without a message, until `fc-cache -f`
       was remembered. It was not remembered. Measured on the evening this
       moved: installing 4 font packages dropped them, and reinstating them
       took a command nothing prompts for.

       Here, root's own rebuild carries them, because root is who reads this
       directory. Nothing has to be remembered afterwards, which is the only
       property worth having. Verified by giving fontconfig a user
       configuration holding none of these rules and an empty user cache,
       touching the font directory, running the hook's own `fc-cache -s`, and
       asking again: BabelStone Han still comes back with an empty langset.

       This is the one file in this repository that is written outside $HOME,
       and it needs sudo once per host. install writes it only when the
       content differs, so a second run touches nothing.

       KEEP THE REST IN fontconfig/fonts.conf. Only scan rules belong here.
       A match rule is evaluated per lookup, carries no cache dependency, and
       putting one in a system path would only make it harder to find. -->

  <!-- BabelStone Han and HanaMin cover the CJK extension blocks Noto does not
       reach, and they claim enough of Unicode besides that fontconfig will
       hand them ordinary text and even emoji. Reassigning the language they
       declare keeps them out of language-based selection, leaving them as
       what they are for: a last resort for a codepoint nothing else has.

       It has to be a langset and not a string, and this is the expensive
       part. fontconfig stores whatever type the edit produced, and lang is a
       langset; assign a string and the property holds a string instead.
       fontconfig's own matcher copes with that, so fc-match answers correctly
       and nothing here looks wrong, but a consumer that asks for the langset
       and calls FcLangSetHasLang on what it gets back is handed a bad
       pointer. Ghostty segfaults on it, in the terminal and in `ghostty
       +show-face`, with FcLangSetHasLang on frame 0. Deleting the property
       instead crashes it the same way.

       And zxx, not the und-zsye this said first. fontconfig knows und-zsye,
       it being the emoji script, so the font went on declaring a language and
       Ghostty read a font declaring that one as an emoji font, which costs
       these two the one job they are here for: a codepoint nothing else
       covers draws as tofu rather than falling to them. fontconfig does not
       know zxx, the code for no linguistic content, so what reaches the cache
       is an empty langset. That is the shape wanted on both sides at once: it
       matches no language, and it is still a langset, so nothing faults on
       reading it. Measured across the three: with und-zsye U+20000 is not
       found, with no rule at all emoji resolves to HanaMinA, and with zxx
       emoji stays on Noto Color Emoji while U+20000 answers BabelStone Han.
       `fc-list -f '%{lang}' :family=BabelStone Han` prints nothing, which is
       the empty langset and is correct, not a sign the rule missed. install
       checks exactly that, because a rule that has silently stopped applying
       looks the same as one that was never needed. -->
  <match target="scan">
    <test name="family"><string>BabelStone Han</string></test>
    <edit name="lang" mode="assign">
      <langset><string>zxx</string></langset>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains"><string>HanaMin</string></test>
    <edit name="lang" mode="assign">
      <langset><string>zxx</string></langset>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains"><string>花園明朝</string></test>
    <edit name="lang" mode="assign">
      <langset><string>zxx</string></langset>
    </edit>
  </match>

</fontconfig>
