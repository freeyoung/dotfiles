<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Despite the name, fontconfig reads this for every application, not only
       sandboxed ones: it sits in ~/.config/fontconfig/conf.d, which is part of
       the ordinary search path. A rule put here to help a sandbox changes the
       terminal and the browser too. One such rule, mapping PingFang SC onto
       Noto, quietly overruled a PingFang installed later, and took an
       afternoon to find.

       KEEP IN SYNC WITH ~/dotfiles/fontconfig/fonts.conf

       The CJK rules below are a deliberate copy of the ones in that file.
       Editing either copy alone leaves the two disagreeing: change the rules
       here and ordinary applications keep the old behaviour, change them there
       and every sandboxed application keeps the old behaviour. There is no
       mechanism that will warn about the drift, so the check has to be manual.

       What is shared is the 2 match blocks: the weak prepend and the language
       rules. The generic-family aliases and the scan rules are not copied,
       because inside a sandbox the distribution's own generics still apply and
       only the CJK preference is missing. So the 2 files are not, and are not
       meant to be, the same file.

       Why the copy exists: fonts.conf reaches ~/.config as a symlink into the
       dotfiles tree, and a sandbox that binds ~/.config without binding
       ~/dotfiles leaves that link pointing at a path which does not exist
       inside, so fontconfig silently reads nothing. WeChat's bwrap sandbox is
       one such case; without these rules its Han characters fall through the
       plain ordering and render in Noto Sans CJK KR, in Korean glyph forms.

       Do not "tidy" this into a symlink to the dotfiles copy. A link is
       exactly what fails to cross the sandbox boundary, and it fails without
       an error, which is what made the original problem hard to see. This file
       has to stay a real file.

       Turning the dotfiles install into a copy instead of a symlink would
       remove the duplication, but then editing fonts.conf would not take
       effect until install is re-run, which is easy to forget. That trade was
       considered and rejected. -->

  <!-- Han is shared across the CJK locales but drawn differently in each, so a
       pattern that names Chinese has to say which faces it means. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- The embedded browser that draws 公众号 articles resolves a missing glyph
       one character at a time, carrying neither family nor lang, so the rule
       above never fires there and the bare ordering decides instead. A weak
       binding sits behind whatever the page actually asked for, and charset
       matching still keeps these out of Latin and emoji runs. -->
  <match target="pattern">
    <edit name="family" mode="prepend" binding="weak">
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- WeChat asks for the macOS and Windows faces it was built against and
       names Noto only last. None of the four are installed, and an unknown
       family falls into the Latin sans ordering, so the request would resolve
       to Liberation Sans and leave a mixed line in two disagreeing faces. -->
  <alias binding="strong">
    <family>Hiragino Sans GB</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Source Han Sans CN</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>

</fontconfig>
