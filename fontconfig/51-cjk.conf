<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Installed to /etc/fonts/conf.d/51-cjk.conf. Both halves of that path
       are load-bearing.

       /etc, because two different things need these rules and only this
       directory reaches both. Applications read the system font cache before
       the user's own, and root rebuilds that cache from /etc on every font
       package, so scan rules kept under $HOME were silently replaced by a
       cache that had never seen them. And a sandbox binds /etc wholesale
       while /home inside it is a tmpfs: read from the bwrap command line that
       starts WeChat, a read only bind of /etc over itself sitting next to a
       tmpfs on /home. That is why a symlink into this repository dangles in
       there, and why these rules used to be duplicated into a second file
       just to reach it. One copy
       here serves the terminal, the browser and the sandbox alike.

       51, because the user's configuration is not read last. 50-user.conf
       pulls in ~/.config/fontconfig/conf.d and then fonts.conf, at position
       50, which puts everything this repository says ahead of 60-latin,
       65-nonlatin and 90-synthetic. These rules were written and measured
       there. 51 is the first position after that include, so they keep the
       neighbours they were tested against; 99 would have moved them past
       three files that also touch generic families, for nothing.

       What is not here: the generic family aliases and the Latin
       substitutions, which stay in fonts.conf because that file is a symlink
       into the repository and edits to it take effect at once. Fonts a
       sandbox needs are here; fonts only this desktop needs are there. -->

  <!-- BabelStone Han and HanaMin cover the CJK extension blocks Noto does not
       reach, and they claim enough of Unicode besides that fontconfig will
       hand them ordinary text and even emoji. Reassigning the language they
       declare keeps them out of language-based selection, leaving them as
       what they are for: a last resort for a codepoint nothing else has.

       It has to be a langset and not a string. fontconfig stores whatever
       type the edit produced, and lang is a langset; assign a string and the
       property holds a string instead. fontconfig's own matcher copes with
       that, so fc-match answers correctly and nothing looks wrong, but a
       consumer that asks for the langset and calls FcLangSetHasLang on what
       it gets back is handed a bad pointer. Ghostty segfaults on it, in the
       terminal and in `ghostty +show-face`, with FcLangSetHasLang on frame 0.
       Deleting the property instead crashes it the same way.

       And zxx, not und-zsye. fontconfig knows und-zsye, it being the emoji
       script, so the font goes on declaring a language and Ghostty reads a
       font declaring that one as an emoji font, which costs these two the one
       job they are here for. fontconfig does not know zxx, the code for no
       linguistic content, so an empty langset is what reaches the cache: it
       matches no language, and it is still a langset. Measured across the
       three: with und-zsye U+20000 is not found, with no rule at all emoji
       resolves to HanaMinA, and with zxx emoji stays on Noto Color Emoji
       while U+20000 answers BabelStone Han.

       These are scan rules, so they take effect when a font is read into the
       cache. Unlike everything below them in this file they need `fc-cache`,
       which install runs whenever it writes this file. Their position among
       the conf.d files does not matter, only that they are read before the
       cache is built; it is the rules below that need the 51. -->
  <match target="scan">
    <test name="family"><string>BabelStone Han</string></test>
    <edit name="lang" mode="assign">
      <langset><string>zxx</string></langset>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains"><string>HanaMin</string></test>
    <edit name="lang" mode="assign">
      <langset><string>zxx</string></langset>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains"><string>花園明朝</string></test>
    <edit name="lang" mode="assign">
      <langset><string>zxx</string></langset>
    </edit>
  </match>

  <!-- Chromium and Electron resolve a missing glyph one character at a time,
       on a pattern carrying neither a family nor a language, so the language
       rules below never fire for them and the bare ordering decides. That is
       how Chinese ends up in Japanese forms there. Naming the SC faces as a
       last resort covers it; all three Noto ones are listed because a
       monospace pattern carries a spacing requirement the proportional face
       cannot satisfy. The terminal takes this path too.

       Appended rather than prepended, and that word is the whole of it. A
       fallback lookup names no family, so appending to an empty list is the
       prepend this once was and that path is untouched. A lookup that does
       name a family is where they differ: weak binding holds these behind the
       strong names but not behind the other weak ones, where position
       decides, and in front of the list they answered every family name the
       host does not have. Chrome drew a page's Latin in PingFang's Latin for
       asking after Helvetica. Appended, the request the page made comes
       first, and an unknown family fails cleanly so the list moves on to what
       the page named next. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- A pattern that names its language gets that language's variant, ahead
       of the last resort above. Han is shared across these locales and drawn
       differently in each, so this is what keeps Japanese text in Japanese
       forms rather than Chinese ones.

       Only the Chinese rule used to reach a sandbox, the copy that served one
       having carried that rule alone. All four do now, which is a change and
       not only a move: Japanese and Korean inside WeChat were falling through
       to the block above and coming out in Chinese forms. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- Chrome carries its own default per script, and for Han it asks for Noto
       Sans CJK SC by name, a font that is installed here. So a page declaring
       lang="zh-CN" never reaches the block above: the request resolves, and
       it resolved to Noto while every other Chinese on the machine was
       PingFang. This says the one thing this tree is trying to say, that
       Chinese is PingFang, without taking the ordering back off the pages.

       Three aliases used to sit beside this one, sending WeChat's Hiragino
       Sans GB, Microsoft YaHei and Source Han Sans CN here. They are gone,
       and what killed them was the append above. WeChat asks for
       `Microsoft YaHei, PingFang SC, Hiragino Sans GB, Source Han Sans CN,
       Noto Sans CJK SC, sans-serif`, which is readable in the binary, and its
       second choice has been installed on this machine since PingFang landed.
       The prepend was answering the first name with a font instead of failing
       on it, so the list never advanced; appended, Microsoft YaHei resolves
       to nothing and PingFang SC is simply next. Measured with that exact
       stack, with the three aliases and without: the same face either way. -->
  <alias binding="strong">
    <family>Noto Sans CJK SC</family>
    <prefer><family>PingFang SC</family></prefer>
  </alias>

</fontconfig>
