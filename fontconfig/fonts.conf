<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Noto Sans CJK ships SC, TC, JP, KR and HK under one family, and
       fontconfig picks between them by whatever the ordering leaves first,
       which lands on JP. Everything here adds to the generic families rather
       than replacing them, so a distribution that already assigns its own
       faces to sans-serif and the rest keeps them: on Omarchy this file loads
       directly after its 50-omarchy.conf and the two compose. -->

  <!-- KEEP IN SYNC WITH ~/.config/fontconfig/conf.d/99-cjk.conf

       The CJK rules in this file are copied there, because this one does not
       reach sandboxed applications at all: install links it into ~/.config,
       and a sandbox that binds ~/.config without binding this tree leaves the
       link pointing at a path that does not exist inside, which fontconfig
       reads as nothing at all rather than as an error. Editing the rules here
       therefore changes nothing for WeChat or any other bwrap or Flatpak
       application until the copy is edited to match. `install` copies it from
       fontconfig/99-cjk.conf beside this file, so the copy is version
       controlled; it is a copy and not a link for the reason above.

       What is shared is the 2 match blocks below: the weak append and the
       language rules. The generic-family aliases and the Latin substitutions
       are not, because a sandbox still has the distribution's own generics and
       only the CJK preference is missing. The 2 files are not meant to be
       identical. The scan rules are in neither of them any more; they are in
       fontconfig/31-cjk-lastresort.conf, and /etc is a path a sandbox can
       see, so that copy serves both.

       And that copy is read outside a sandbox as well, conf.d being part of
       the ordinary search path, so a rule put there for WeChat reaches the
       terminal too. -->

  <!-- The rules that take BabelStone Han and HanaMin out of language-based
       selection used to sit here. They are scan rules, so what they say ends
       up in the font cache rather than in this file, and the cache that
       applications read is the system one, which root rebuilds on every font
       package from /etc and without ever seeing this tree. Kept here they
       were dropped, silently, by any `pacman -S` that touched a font. They
       now live in fontconfig/31-cjk-lastresort.conf, which install writes to
       /etc/fonts/conf.d, where the rebuild that keeps overwriting them is
       also the rebuild that carries them. Everything below is a match rule,
       evaluated per lookup, with no cache in the path at all. -->

  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept><family>Noto Serif CJK SC</family></accept>
  </alias>

  <!-- PingFang is the Mac's Chinese face, named first here so that both
       desktops draw Chinese the same. Two things to know about it. Apple ships
       it with macOS and nowhere else, so the copy on this host is a third
       party's repackaging (otf-apple-pingfang), whose own description says the
       fonts were modified. And its Han advance is 1 em where 2 JetBrains Mono
       cells come to 1.2, so a terminal scales each glyph to 5/6 of its box:
       Chinese reads a little lighter here than Noto does. PingFang SC Medium
       in place of PingFang SC is the answer if that ever grates.

       The Mac draws Chinese in PingFang too, and is told so in its own file,
       macos/ghostty/macos.conf, because macOS has no fontconfig for this to be
       said in. Changing the Chinese font means changing that line as well as
       the 3 places in this file and the 2 in 99-cjk.conf. Nothing links them
       and nothing will warn about the half that was missed. -->
  <alias>
    <family>monospace</family>
    <accept>
      <family>PingFang SC</family>
      <family>Noto Sans Mono CJK SC</family>
    </accept>
  </alias>

  <!-- Chromium and Electron resolve a missing glyph one character at a time,
       with neither family nor lang on the pattern, so neither the aliases nor
       the language rules below fire and the bare ordering decides. That is how
       Chinese ends up in Japanese forms there. Naming the SC variants as a
       last resort covers that path; all three are listed because a monospace
       pattern carries a spacing requirement the proportional face cannot
       satisfy.

       Appended rather than prepended, and that word is the whole of it. A
       fallback lookup names no family, so appending to an empty list and
       prepending to one come to the same thing, and this path is untouched
       by the choice. A lookup that does name a family is where they differ.
       Weak binding only ranks these behind the strong names; among the weak
       entries themselves position decides, and prepending put them in front
       of everything the pattern had been handed. Chrome then answered with
       PingFang for every family it could not find on the machine, for
       Helvetica and Segoe UI and Roboto and Inter and Georgia alike, and drew
       that page's Latin in PingFang's own Latin. Appending leaves the site's
       request, and fontconfig's ordinary substitutions for it, ahead of this
       block, which is where a last resort belongs.

       This comment used to say that charset matching kept these out of Latin
       runs. Charset does outrank family, and that is what saves emoji and the
       Nerd Font glyphs, which PingFang cannot draw. But PingFang carries a
       full Latin, so charset never excluded it from a Latin run: only the
       ordering could, and the ordering was pointing the wrong way.

       This block is also what the terminal gets: a fallback lookup carries
       neither family nor lang either, so the language rules below never fire
       for it, and, the family list being empty, the append reads as a
       prepend. Measured by asking `ghostty +show-face` for 中, which answers
       PingFang SC with this block and Noto Sans Mono CJK JP without it. The
       monospace alias above is no longer part of that: it was once needed to
       put the face in the list at all, and with the append it can be removed
       and the terminal still lands on PingFang. It is kept for the pattern
       that names monospace outright. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- A pattern that names its language gets that language's variant, ahead
       of the last-resort SC above. Han characters are shared but drawn
       differently per region, so this is what keeps Japanese text in Japanese
       forms rather than Chinese ones.

       The binding is strong, and what that buys has shrunk. It was measured
       under the prepend above: turning it down to weak left FcFontSort
       ranking the right variant first, so Ghostty and anything else on pango
       saw no difference, but FcFontMatch dropped to Liberation Sans, a font
       with no CJK at all, and that was read as the Chromium path. It was not.
       Chrome puts no lang on the patterns it sends, so these rules never fire
       for it; what it draws Chinese in is the block above. Measured again
       with the append, weak and strong are indistinguishable in Chrome, in
       fc-match and in Ghostty alike, and the price of strong stands
       unchanged: an application naming its own CJK family is overruled.
       Strong is kept because nothing here needs it to be weak, not because
       something was found that breaks without it. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- Faces the web asks for that no Linux host can have. Apple's and
       Microsoft's are licensed to their own platforms, so the request lands on
       nothing and Chrome falls back to its standard font, which is a serif:
       a page asking for Menlo got Liberation Serif, and one asking for Segoe
       UI got it too. Each of these names something installed that is close in
       design, so the page gets the shape it was after.

       prefer and not accept, which is the difference between this working and
       not. accept appends the substitute after the requested family, which
       fc-match honours and Chrome ignores: measured, every one of these still
       came out Liberation Serif. prefer puts it in front, and Chrome answers
       with it. binding="same" carries the strength of the request, which is
       strong when a page names a font, and that is what Chrome requires of
       anything it accepts as a substitution.

       The cost of prefer is that it wins over a real one. Install the genuine
       Georgia or Segoe UI here one day and the line for it has to go, or it
       will go on drawing the substitute. Nothing warns about that.

       Not copied into 99-cjk.conf. That file is a copy so a sandbox can still
       find the CJK rules, and a sandboxed application drawing Latin in a
       slightly wrong sans is not worth doubling the sync burden again. -->
  <!-- URW's Helvetica, which is what Neue is a tighter cut of -->
  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer><family>Nimbus Sans</family></prefer>
  </alias>
  <!-- humanist, open apertures, the nearest thing here -->
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <!-- humanist too -->
  <alias binding="same">
    <family>Trebuchet MS</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Lucida Grande</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <!-- both descend from Bitstream Vera -->
  <alias binding="same">
    <family>Verdana</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <!-- Verdana's narrow cut, and nothing here is narrower -->
  <alias binding="same">
    <family>Tahoma</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <!-- a screen serif with the same large x-height -->
  <alias binding="same">
    <family>Georgia</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <!-- Menlo is a modified DejaVu Sans Mono -->
  <alias binding="same">
    <family>Menlo</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Monaco</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>SF Mono</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <!-- Inter is the face the web reaches for when it wants SF -->
  <alias binding="same">
    <family>SF Pro Text</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>SF Pro Display</family>
    <prefer><family>Inter</family></prefer>
  </alias>

</fontconfig>
