# The colours come from whichever theme Omarchy currently points at. Included
# as a glob rather than by name: kitty ignores a pattern that matches nothing,
# where a plain include of a missing file is a startup error in the window --
# which is what a host without Omarchy would get on every launch. It falls back
# to kitty's own colours there.
globinclude ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 11.0
# No ligatures. JetBrains Mono keeps all 150 of them in calt and has no liga
# feature, so this is the only switch -- ss19 only restyles == === != !== after
# calt has already formed them, and cannot bring them back selectively. The
# name here is the PostScript name, not the family name above. Turning calt off
# also drops one contextual alternate for the German sharp s, which is the only
# thing in there that is not a ligature.
font_features JetBrainsMonoNF-Regular -calt

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Resizing the window leaves old, differently-wrapped copies of TUI output
# in the scrollback, since kitty does not reflow history on resize. Wipe the
# scrollback only -- 'clear_terminal reset' would also reset terminal modes
# out from under a running TUI, which then emits stray escape sequences.
map ctrl+shift+alt+l clear_terminal scrollback active

# Allow remote access
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
