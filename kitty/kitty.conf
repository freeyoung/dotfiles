# The colours come from whichever theme Omarchy currently points at. Included
# as a glob rather than by name: kitty ignores a pattern that matches nothing,
# where a plain include of a missing file is a startup error in the window --
# which is what a host without Omarchy would get on every launch. It falls back
# to kitty's own colours there.
#
# The pattern has to be relative. globinclude rejects an absolute or ~-prefixed
# one outright, with "Non-relative patterns are unsupported", which is a startup
# error rather than the silent skip the glob was chosen for. Relative means
# relative to the directory holding this file, and both of the places it is read
# from -- ~/.config/kitty and this repository's kitty/ -- sit two levels under
# $HOME, so one pattern serves both.
globinclude ../../.local/state/omarchy/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 11.0
# The cell, cut to the proportions of the iTerm2 profile the Mac's terminals
# copy. A ratio carries between machines where a point size does not, so this
# is said once for both; the Ghostty beside this one says the same 2 numbers as
# -6% and -4% in its own shared file. What lands is the whole pixel nearest the
# ratio, so the realised cut is a little off it and moves with the cell size;
# both terminals ask the same of the same face and round to the same pixel,
# which is what keeps them matching. The Ghostty file carries the measurements.
modify_font cell_width 94%
modify_font cell_height 96%
# No ligatures. JetBrains Mono keeps all 150 of them in calt and has no liga
# feature, so this is the only switch -- ss19 only restyles == === != !== after
# calt has already formed them, and cannot bring them back selectively. The
# name here is the PostScript name, not the family name above. Turning calt off
# also drops one contextual alternate for the German sharp s, which is the only
# thing in there that is not a ligature.
font_features JetBrainsMonoNF-Regular -calt

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Resizing the window leaves old, differently-wrapped copies of TUI output
# in the scrollback, since kitty does not reflow history on resize. Wipe the
# scrollback only -- 'clear_terminal reset' would also reset terminal modes
# out from under a running TUI, which then emits stray escape sequences.
map ctrl+shift+alt+l clear_terminal scrollback active

# Smart selection, like iTerm2's: ctrl+shift+p, then o, marks git remotes such as
# git@github.com:owner/repo.git and references such as owner/repo#123. The hint
# key shown beside a match opens it in the browser. The rules are in
# smart_hints.py, which install links beside this file.
map ctrl+shift+p>o kitten hints --customize-processing smart_hints.py

# Remote control over the socket only, never from a program writing escape
# codes into a window. What uses it: bin/claude-tab-status, when the bar widget
# asks it to raise the kitty tab a Claude session lives in.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Omarchy draws what a Claude Code session is doing into the tab bar and the
# window title, and omarchy/kitty/claude-status.conf turns that on. Linked into
# this directory there and nowhere else; a glob that matches nothing is skipped
# in silence, where a plain include of a missing file is a startup error in
# every window -- the same reason the theme above is pulled in this way. It
# comes after the block above because the later setting is the one that counts.
globinclude claude-status.conf

# The macOS layer, which makes kitty look and work like iTerm2. install links
# macos/kitty/macos.conf here on macOS only, so on any other host this glob
# matches nothing. It is the last line so that its settings win over every
# setting above, the ones Omarchy needs included.
globinclude macos.conf
