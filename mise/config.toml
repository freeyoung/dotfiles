# Tools mise installs globally, on every host. Per-project versions come from
# each repository's own mise.toml and take precedence over these.
#
# Language runtimes are pinned; the CLIs track latest, since they are moving
# fast enough that a pin here would only ever be stale.
[tools]
claude = "latest"
codex = "latest"
gh = "latest"
herdr = "latest"
node = "26.7.0"
opencode = "latest"
pi = "latest"
pnpm = "latest"

# Each tool above lives only in mise; Homebrew, npm -g and the vendors' own
# installers must not install a second copy. Left to itself, Claude Code
# updates by installing a native copy in ~/.local/bin; `mise upgrade` updates
# it here instead.
[env]
DISABLE_AUTOUPDATER = "1"

[settings.upgrade]
auto_prune = false
