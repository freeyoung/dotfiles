# Behaviour of the Wubi (五笔) table input method. fcitx5 merges this over its
# own defaults, so only the settings that depart from them are listed. It reads
# this from ~/.config/fcitx5/table/, not from ~/.config/fcitx5/inputmethod/,
# which is where the input method is registered rather than configured.
#
# Changing anything through fcitx5's configuration tool rewrites this file in
# full: the symlink survives, but every default is written out explicitly and
# these comments are lost. Trim it back to the settings below afterwards.

[Table]
# AutoSelect is the master switch for committing without a manual choice; with
# it off, the two length settings below do nothing at all.
AutoSelect=True
# Never commit a code just because it is the only match. Four-code characters
# that are unique still wait for the space bar, so the hands keep one rhythm
# instead of two.
AutoSelectLength=0
# Commit the pending code once a fifth keystroke cannot extend it. Wubi codes
# are at most four keys, so the fifth key is unambiguously the next character
# and typing simply flows on.
NoMatchAutoSelectLength=4
# Learn a phrase after it has been typed three times, rather than the default
# ten. Phrases learned this way are written to
# ~/.local/share/fcitx5/table/wubi-large.user.dict.
SaveAutoPhraseAfter=3
