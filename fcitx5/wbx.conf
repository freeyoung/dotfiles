# Behaviour of the Wubi (五笔字型, wbx) table input method, shared by the Linux
# fcitx5 and fcitx5-macos. fcitx5 merges this over its own defaults, so only
# the settings that depart from them are listed. It reads this from
# ~/.config/fcitx5/table/, not from ~/.config/fcitx5/inputmethod/, which is
# where the input method is registered rather than configured.
#
# wbx rather than wubi-large: the large table has some 50,000 more entries,
# mostly rare characters, and they are what turns an unambiguous code into a
# choice. About 27% of its codes have more than one candidate against 15% for
# wbx.
#
# Changing anything through fcitx5's configuration tool rewrites this file in
# full: the symlink survives, but every default is written out explicitly and
# these comments are lost. Trim it back to the settings below afterwards.

[Table]
# AutoSelect is the master switch for committing without a manual choice; with
# it off, the two length settings below do nothing at all.
AutoSelect=True
# Never commit a code just because it is the only match. Four-code characters
# that are unique still wait for the space bar, so the hands keep one rhythm
# instead of two.
AutoSelectLength=0
# Commit the pending code once a fifth keystroke cannot extend it. Wubi codes
# are at most four keys, so the fifth key is unambiguously the next character
# and typing simply flows on.
NoMatchAutoSelectLength=4
# Rank candidates by what was typed just before them. This only acts on top of
# wbx's frequency ordering (OrderPolicy=Freq), which is its default.
UseContextRelatedOrder=True
# Never promote an auto phrase to a user phrase on repetition alone. Promoting
# after three uses filled the user dict with fragments of sentences that were
# typed often ("入法" out of "输入法"). Auto phrases still appear as candidates,
# and one becomes a user phrase once it is chosen. fcitx-dict
# (github.com/freeyoung/fcitx-dict) relies on this: it syncs every user phrase
# to the other machines, so each one has to be a word someone meant.
SaveAutoPhraseAfter=0
