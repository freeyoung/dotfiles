# A fcitx5 classicui candidate window theme in the colours of WeType, the
# WeChat keyboard -- the Linux counterpart of ../../theme/wetype.conf, which
# only fcitx5-macos can read. classicui takes light or dark from the desktop by
# switching between two themes, so the colour sets are two directories:
# wetype and wetype-dark.
#
# classicui draws no blur of its own outside KWin, and Hyprland's blur is off
# here, so the panel is opaque: it is the Mac panel colour as it looks over a
# plain background. A rounded corner has to come from an image, cut in nine by
# the Margin below it. Each radius equals the smallest margin of its image,
# because a corner that reaches past its margin is stretched with the edge.
# An image is looked up in this directory only, which is why the paging and
# menu images are here too.

[Metadata]
Name=WeType Dark
Version=1
Author=Eric Qian
Description=WeType green on a dark grey panel
ScaleWithDPI=True

[InputPanel]
NormalColor=#ffffff
HighlightCandidateColor=#ffffff
HighlightColor=#ffffff
HighlightBackgroundColor=#00b175
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

[InputPanel/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/Background]
Image=panel.svg

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=10
Right=10
Top=6
Bottom=6

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#ffffff
HighlightCandidateColor=#ffffff

[Menu/Background]
Image=panel.svg

[Menu/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/ContentMargin]
