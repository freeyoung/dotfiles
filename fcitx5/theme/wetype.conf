# A fcitx5-macos candidate window theme in the colours of WeType, the WeChat
# keyboard: a green highlight on a translucent grey panel. It is adapted from
# a Squirrel (Rime) colour scheme posted at https://www.v2ex.com/t/1094471.
#
# Blur is Blur, not System: with System, macOS 26 and later draw Liquid Glass,
# which takes light or dark from the app behind it, not from the system, so
# the two colour sets below would not apply. The labels use JetBrainsMono NF
# where it is installed; the candidates keep the system font.
#
# Only keys that differ from the defaults are set. Loading a theme writes
# every option to conf/webpanel.conf, so a later edit here needs a reload.

[LightMode]
OverrideDefault=True
HighlightColor=#00b175ff
HighlightHoverColor=#009e68ff
HighlightTextColor=#ffffffff
HighlightTextPressColor=#d9f2e8ff
HighlightLabelColor=#ffffffcc
HighlightCommentColor=#ffffffcc
HighlightMarkColor=#ffffffff
PanelColor=#f0f0f0c8
TextColor=#424242ff
LabelColor=#999999ff
CommentColor=#999999ff
PagingButtonColor=#424242ff
DisabledPagingButtonColor=#bdbdbdff
AuxColor=#424242ff
PreeditColorPreCaret=#424242ff
PreeditColorCaret=#00b175ff
PreeditColorPostCaret=#424242ff
BorderColor=#ffffff00
DividerColor=#00000000

[DarkMode]
OverrideDefault=True
SameWithLightMode=False
HighlightColor=#00b175ff
HighlightHoverColor=#00c784ff
HighlightTextColor=#ffffffff
HighlightTextPressColor=#d9f2e8ff
HighlightLabelColor=#ffffffcc
HighlightCommentColor=#ffffffcc
HighlightMarkColor=#ffffffff
PanelColor=#5d5d5dc8
TextColor=#ffffffff
LabelColor=#aaaaaaff
CommentColor=#aaaaaaff
PagingButtonColor=#ffffffff
DisabledPagingButtonColor=#888888ff
AuxColor=#ffffffff
PreeditColorPreCaret=#ffffffff
PreeditColorCaret=#00b175ff
PreeditColorPostCaret=#ffffffff
BorderColor=#15151500
DividerColor=#00000000

[Background]
Blur=Blur
Shadow=True

[Font/LabelFontFamily]
0=JetBrainsMono NF

[Size]
OverrideDefault=True
BorderWidth=0
BorderRadius=14
Margin=4
HighlightRadius=10
TopPadding=4
RightPadding=10
BottomPadding=4
LeftPadding=10
LabelTextGap=2
HorizontalDividerWidth=0
