# This file is the only tmux configuration this repository installs, and it is
# meant to be the only one tmux loads. tmux reads /etc/tmux.conf, ~/.tmux.conf,
# and $XDG_CONFIG_HOME/tmux/tmux.conf in that order, applying each in turn, so
# a second file does not merely supplement this one -- it silently overrides
# every setting the two have in common. Omarchy ships such a file; the
# installer moves it aside, and what was worth keeping from it lives here.

# Ctrl-B stays the prefix: it is what an unconfigured tmux on any server
# answers to, and that muscle memory is worth more than a nicer chord. Ctrl-A
# is deliberately not used -- it is readline's start-of-line. Omarchy's
# Ctrl-Space is kept as the secondary prefix, so both work here.
set -g prefix C-b
set -g prefix2 C-Space
bind -N "Send the prefix through to the program" C-Space send-prefix

# Use tmux's 256-color terminal description.
set -g default-terminal "tmux-256color"
# Advertise true-color and clipboard support to applications inside tmux. The
# wildcard covers whatever the outer terminal reports rather than
# xterm-256color alone.
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:clipboard"
# Kitty receives CSI-u sequences but its terminfo does not say so, so name it.
set -as terminal-features ",xterm-kitty:extkeys"
# Let programs inside tmux emit escape sequences straight to the terminal --
# inline images and OSC 52 clipboard writes from a nested session need this.
set -g allow-passthrough on
# Forward modified keys the terminal would otherwise flatten, so Ctrl-Enter
# and Shift-Enter reach the program instead of arriving as a bare Enter.
set -g extended-keys on
# extended-keys-format is newer than extended-keys itself. A tmux without it
# reports an invalid option and carries on, which is noise on every server
# running an older one, so ask before setting it.
if-shell 'tmux show -g extended-keys-format' 'set -g extended-keys-format csi-u'
# Avoid delaying escape-sequence interpretation.
set -sg escape-time 0
# Let editors know when the terminal gains or loses focus.
set -g focus-events on
# Allow mouse selection, pane resizing, and window switching.
set -g mouse on
# Keep a large scrollback buffer per pane.
set -g history-limit 100000
# Forward tmux clipboard changes to the terminal clipboard.
set -s set-clipboard on

# Refresh the status line every second so the clock's seconds stay current.
set -g status-interval 1
# Keep status messages visible for three seconds.
set -g display-time 3000
# Close numbering gaps when windows are closed.
set -g renumber-windows on
# Number windows and panes from 1, matching the keyboard rather than the
# array. Combined with renumber-windows the numbers stay contiguous.
set -g base-index 1
setw -g pane-base-index 1
# Size a window to the smallest client actually looking at it, rather than to
# the smallest attached to the session.
setw -g aggressive-resize on
# Killing a session switches to another one instead of dropping out of tmux.
set -g detach-on-destroy off
# Name each window after the directory its pane is in.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
# Keep the terminal window title in step with the session.
set -g set-titles on
set -g set-titles-string '#h:#W'

# The status line names colors rather than giving hex values, so it follows
# whatever palette the terminal is themed with -- Omarchy's theme switcher
# repaints it for free, and a 16-color terminal on a server still renders it.
set -g status-position top
set -g status-style "bg=default,fg=default"
# Reserve enough space for the session name on the left.
set -g status-left-length 30
# Reserve enough space for the mode flags, host, date, and time on the right.
set -g status-right-length 50
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
# Flags first, because they say why the keyboard is not behaving as usual.
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h %Y-%m-%d %H:%M:%S "
set -g window-status-separator ""
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
# Highlight copy-mode selections.
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Every binding below carries a note, so `prefix ?` and `list-keys -N` read as
# documentation rather than as a dump of commands.

# Split horizontally, inherit the directory, and balance the layout.
bind -N "Split pane horizontally" % split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
# Split vertically, inherit the directory, and balance the layout.
bind -N "Split pane vertically" '"' split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
# Vim directions, repeatable without pressing the prefix again. Omarchy binds
# h and k to split-pane and kill-window; those are dropped rather than have
# two of these four keys mean something else entirely.
bind -N "Focus pane left" -r h select-pane -L
bind -N "Focus pane down" -r j select-pane -D
bind -N "Focus pane up" -r k select-pane -U
bind -N "Focus pane right" -r l select-pane -R
# Cycle through panes.
bind -N "Focus next pane" Tab select-pane -t:.+
bind -N "Focus previous pane" BTab select-pane -t:.-
# Resize by five cells at a time.
bind -N "Grow pane left" -r < resize-pane -L 5
bind -N "Grow pane right" -r > resize-pane -R 5
bind -N "Grow pane up" -r + resize-pane -U 5
# Panes are cheap and this pairs with Alt-Escape below, so skip the
# confirmation tmux asks for by default.
bind -N "Kill pane" x kill-pane

# New windows start where the current pane is, not in the home directory.
bind -N "Create window" c new-window -c "#{pane_current_path}"

# Session controls, on the shifted keys so they cannot be hit by accident.
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

# Omarchy's no-prefix Alt layer. These are worth the keys they occupy because
# they are the ones used constantly, and none of them collide with the
# Alt-Space that switches input methods.
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind -N "Kill pane" -n M-Escape kill-pane
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D
bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5
bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9
bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Use Vim-style keys while navigating copy mode.
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel
bind -N "Copy selection" -T copy-mode-vi Enter send -X copy-selection-and-cancel

# Open tmux's command prompt.
bind -N "Command prompt" : command-prompt
# Reload this configuration and show a confirmation message.
bind -N "Reload configuration" r source-file ~/.tmux.conf \; display-message "Reloaded tmux.conf"
# Omarchy's searchable keybinding popup where it exists; elsewhere the notes
# above still read well through tmux's own list-keys.
if-shell 'command -v omarchy-menu-tmux-keybindings >/dev/null 2>&1' \
  'bind -N "Show tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"' \
  'bind -N "Show tmux keybindings" ? list-keys -N'
